[DEFAULT]
head = "head.js"
dupe-manifest = true
prefs = [
  "mail.panorama.enabled=true",
]
tags = ["panorama"]

["include:xpcshell-shared.toml"]
["test_copyChaining.js"]
prefs = [
  "mail.serverDefaultStoreContractID=@mozilla.org/msgstore/berkeleystore;1",
  "mail.server.default.storeContractID=@mozilla.org/msgstore/berkeleystore;1",
]

tags = ["mbox"]

["test_moveCopyFoldersAcrossServers.js"]
verbose = true
run-sequentially = true # Times out in parallel runs; passes well within the limit alone.
prefs = [
  "experimental.mail.ews.overrideOAuth.enabled=true",
  "mail.biff.use_new_count_in_badge=false",
  "mailnews.oauth.loglevel=Debug",
  "mail.serverDefaultStoreContractID=@mozilla.org/msgstore/berkeleystore;1",
  "mail.server.default.storeContractID=@mozilla.org/msgstore/berkeleystore;1",
]
tags = ["mbox"]

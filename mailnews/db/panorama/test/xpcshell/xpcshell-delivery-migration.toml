# Manual acceptance; deliberately not registered in moz.build.
[DEFAULT]
head = "head.js head_delivery.js"
environment = [
  "MOZ_LOG=mozStorage:4,panorama:4",
  "PANORAMA_DELIVERY_EXPECT=panorama:mbox",
]
prefs = [
  "mail.panorama.enabled=true",
  "mail.serverDefaultStoreContractID=@mozilla.org/msgstore/berkeleystore;1",
  "mail.server.default.storeContractID=@mozilla.org/msgstore/berkeleystore;1",
]
tags = ["panorama-delivery"]

support-files = ["data/**"]

["test_deliveryMigrationNumericProperties.js"]

["test_deliveryMigrationPropertyPresence.js"]

["test_deliveryMigrationReferences.js"]

["test_deliveryMigrationRepeatAfterSuccess.js"]

["test_deliveryMigrationStringProperties.js"]

["test_deliveryMigrationThreads.js"]

["test_deliveryCoreNativeAfterMigration.js"]

["test_deliveryCoreMigrationFailure.js"]

[DEFAULT]
head = "head_server_setup.js"
support-files = ["postings/*"]
dupe-manifest = true
prefs = [
  "mail.panorama.enabled=true",
  "mail.serverDefaultStoreContractID=@mozilla.org/msgstore/maildirstore;1",
  "mail.server.default.storeContractID=@mozilla.org/msgstore/maildirstore;1",
]
tags = ["panorama", "maildir"]

["test_NntpChannel.js"]
run-sequentially = true  # Uses fixed NNTP_PORT

["test_NntpMessageService.js"]

["test_getNewsMessage.js"]

["test_newsReadChanged.js"]

["test_nntpProcessingError.js"]

["test_nntpRequestLifetime.js"]

["test_panoramaDeliveryNewsDatabaseInit.js"]
head = "head_server_setup.js ../../../db/panorama/test/xpcshell/head_delivery.js"
environment = ["PANORAMA_DELIVERY_EXPECT=panorama:maildir"]

["test_removeExpiredArticles.js"]

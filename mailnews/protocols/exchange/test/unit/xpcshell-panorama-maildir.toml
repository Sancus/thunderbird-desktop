[DEFAULT]
head = "head.js"
support-files = ["data/*"]
dupe-manifest = true
prefs = [
  "mail.panorama.enabled=true",
  "mail.serverDefaultStoreContractID=@mozilla.org/msgstore/maildirstore;1",
  "mail.server.default.storeContractID=@mozilla.org/msgstore/maildirstore;1",
]
tags = ["panorama", "maildir"]

["test_ewsAttachmentSaves.js"]

["test_exchange_service.js"]
verbose = true
prefs = ["mail.graph.enabled=true"]

["test_folder_sync.js"]
prefs = ["mail.graph.enabled=false"]

["test_getMessage.js"]
verbose = true
prefs = ["mail.graph.enabled=true"]

["test_item_operations.js"]
verbose = true
requesttimeoutfactor = 3
prefs = ["mail.graph.enabled=true"]

["test_undo.js"]
verbose = true
prefs = ["mail.graph.enabled=true"]
requesttimeoutfactor = 2 # The added failure-path subtests take ~26s on every platform, near the default limit.
